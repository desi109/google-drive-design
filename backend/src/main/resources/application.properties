server.address=${HOST:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:${DRIVE_DATA:./data}/metadata;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=4
spring.servlet.multipart.enabled=false
server.error.include-message=never
server.tomcat.max-swallow-size=5MB
spring.jackson.deserialization.fail-on-unknown-properties=true
drive.data=${DRIVE_DATA:./data}
drive.seed=${DRIVE_SEED:true}
drive.alice-token=${ALICE_TOKEN:local-alice-key}
drive.bob-token=${BOB_TOKEN:local-bob-key}
drive.eve-token=${EVE_TOKEN:local-eve-key}
